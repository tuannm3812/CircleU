name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No /Applications/Xcode_*.app found on this runner image."
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # Signing.xcconfig is per-developer and git-ignored; CI builds unsigned for the Simulator.
      - name: Create CI signing config
        run: |
          sed -e 's/YOUR_TEAM_ID//' -e 's/YOUR_BUNDLE_PREFIX/com.circleu.ci/' \
            Config/Signing.xcconfig.example > Config/Signing.xcconfig

      - name: Pick an available iPhone simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(p) for p in k.split("iOS-")[-1].split("-")])
          for runtime in reversed(ios):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          else:
              sys.exit("No available iPhone simulator on this runner.")
          ')
          if [ -z "$SIM_ID" ]; then
            echo "::error::No available iPhone simulator found; check the runner image's iOS runtimes."
            exit 1
          fi
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$SIM_ID"

      - name: Run Unit Tests
        run: |
          xcodebuild test -project Circleu.xcodeproj -scheme Circleu \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO
