<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A2 Pingu listening</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; justify-content: space-between"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span></div>
<h1 style="margin: 8px 0 0 0; font-size: 30px; font-weight: 700">What’s on your mind?</h1>
<p style="margin: 0; font-size: 15px; color: #054FC9; font-weight: 600">Listening… tap to stop</p>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<button aria-label="Stop dictation" style="border: none; background: transparent; padding: 0; position: relative; width: 170px; height: 170px; display: flex; align-items: center; justify-content: center">
<span style="position: absolute; left: 0; top: 0; width: 170px; height: 170px; border-radius: 85px; background: #DCEBFF"></span>
<span style="position: absolute; left: 15px; top: 15px; width: 140px; height: 140px; border-radius: 70px; background: #BBD6F7"></span>
<span style="position: absolute; left: 30px; top: 30px; width: 110px; height: 110px; border-radius: 55px; background: #FFFFFF"></span>
<img src="../assets/CanvasPinguListeningLegacy.png" alt="" style="position: relative; width: 120px; height: 120px; object-fit: contain">
</button>
<span style="font-size: 11px; font-weight: 700; color: #B05A00; background: #FFF1E0; border-radius: 8px; padding: 3px 8px">EXISTING ART: Pingu listening · ideal: Pingu holding a mic</span>
</div>
<div style="flex-grow: 1; border-radius: 18px; background: #FFFFFF; padding: 16px; font-size: 17px; color: #0D1421">I keep thinking about what my manager said in the meeting…</div>
<div style="height: 54px; border-radius: 18px; background: #054FC9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Save only my words</div>
</div>
</body>
</html>
