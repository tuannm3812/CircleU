<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today mic denied</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; justify-content: space-between"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span></div>
<h1 style="margin: 8px 0 0 0; font-size: 30px; font-weight: 700">What’s on your mind?</h1>
<p style="margin: 0; font-size: 15px; color: #4F6077">Type, or tap the microphone and talk.</p>
<div style="display: flex; align-items: center; gap: 12px">
<button aria-label="Start dictation" style="width: 56px; height: 56px; border-radius: 28px; border: 2px dashed #8A99AD; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4F6077" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"></path></svg>
</button>
<span style="font-size: 13px; color: #4F6077">Microphone is off</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCE6F2; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; line-height: 1.4">Dictation needs microphone and speech recognition access. Turn them on in Settings, or keep typing.</span>
<a href="#" style="font-size: 14px; font-weight: 700; color: #054FC9; text-decoration: none">Open Settings</a>
</div>
<label style="flex-grow: 1; display: flex; flex-direction: column"><span style="position: absolute; left: -9999px">Your words</span><textarea style="flex-grow: 1; border-radius: 18px; border: none; background: #FFFFFF; padding: 16px; font-family: inherit; font-size: 17px; resize: none">I can still type here.</textarea></label>
<button style="height: 54px; border-radius: 18px; border: none; background: #054FC9; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 17px">Save only my words</button>
</div>
</body>
</html>
