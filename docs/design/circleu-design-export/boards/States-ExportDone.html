<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export done</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div role="status" style="display: flex; gap: 10px; align-items: flex-start; background: #E6F4EC; border-radius: 14px; padding: 12px 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E6B3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="font-size: 14px; line-height: 1.4; color: #134A2B">Export done. The copy you shared is yours to keep or delete.</span>
</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Settings</h1>
<div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<strong style="font-size: 17px">Your data</strong>
<span style="font-size: 14px; color: #4F6077">A text file you can save or share.</span>
<button style="height: 44px; border-radius: 12px; border: 1px solid #DCE6F2; background: #FFFFFF; color: #054FC9; font-family: inherit; font-size: 16px; font-weight: 600">Export my data</button>
<button style="height: 44px; border: none; background: transparent; color: #B3261E; font-family: inherit; font-size: 16px; font-weight: 600">Delete all data</button>
</div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 17px">Privacy and data</strong>
<span style="font-size: 14px; color: #4F6077">Kept on this iPhone. Not uploaded or synced.</span>
</div>
</div>
</body>
</html>
