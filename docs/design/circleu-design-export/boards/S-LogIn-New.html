<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in (proposed)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#054FC9}a:hover{color:#033a96}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="S-Settings-New.html" style="font-size: 16px; font-weight: 600; text-decoration: none">‹ Settings</a>
<span style="font-size: 17px; font-weight: 600">Log in</span>
<button aria-label="What logging in does" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></button>
</div>
<img src="../../../../Circleu/Assets.xcassets/GuestPinguReading.imageset/GuestPinguReading.png" alt="" style="height: 130px; object-fit: contain">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; text-align: center">Bring in your earlier journal</h1>
<div style="display: flex; justify-content: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: #E3EEFF; font-size: 13px; font-weight: 600; color: #054FC9"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 10l5 5 5-5M5 21h14"></path></svg>Copy only</span>
<span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: #E3EEFF; font-size: 13px; font-weight: 600; color: #054FC9"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4v18h-4M10 17l5-5-5-5M15 12H3"></path></svg>Signed out after</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
<span style="position: absolute; left: -9999px">Email</span>
<input type="email" placeholder="Email" style="height: 50px; box-sizing: border-box; border: none; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="position: absolute; left: -9999px">Password</span>
<input type="password" placeholder="Password" style="height: 50px; box-sizing: border-box; border: none; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px">
</label>
<button style="height: 54px; border-radius: 18px; border: none; background: #054FC9; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; margin-top: 4px">Log in</button>
<a href="#" style="align-self: center; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">Forgot password?</a>
</div>
</body>
</html>
