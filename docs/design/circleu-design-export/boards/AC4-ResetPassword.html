<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password (proposed)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#054FC9}a:hover{color:#033a96}
.chip{display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: #E3EEFF; font-size: 13px; font-weight: 600; color: #054FC9}
.primary{height: 54px; border-radius: 18px; border: none; background: #054FC9; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600}
.secondary{height: 54px; border-radius: 18px; border: 1px solid #DCE6F2; background: #FFFFFF; color: #054FC9; font-family: inherit; font-size: 17px; font-weight: 600}
.ib{width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px"><a href="S-LogIn-New.html" style="font-size: 16px; font-weight: 600; text-decoration: none">‹ Log in</a><span style="font-size: 17px; font-weight: 600">Reset password</span><span style="width: 60px"></span></div>
<div style="display: flex; justify-content: center; padding: 24px 0 8px 0"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 6.5l8.5 6.5 8.5-6.5"></path></svg></div>
<label style="display: flex; flex-direction: column">
<span style="position: absolute; left: -9999px">Email</span>
<input type="email" placeholder="Email" style="height: 50px; box-sizing: border-box; border: none; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px">
</label>
<button class="primary">Send reset link</button>
<div style="height: 1px; background: #DCE6F2; margin: 20px 0"></div>
<span style="font-size: 12px; color: #4F6077; text-align: center">After sending:</span>
<div style="display: flex; justify-content: center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3.5 6.5l8.5 6.5 8.5-6.5"></path><circle cx="19" cy="17" r="4" fill="#054FC9" stroke="none"></circle><path d="M17.3 17l1.2 1.2 2.2-2.4" stroke="#FFFFFF" stroke-width="1.6"></path></svg></div>
<h2 style="margin: 0; font-size: 22px; font-weight: 700; text-align: center">Check your email</h2>
<p style="margin: 0; font-size: 15px; color: #4F6077; text-align: center">If an account uses this email, a link is on its way.</p>
</div>
</body>
</html>
