<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#054FC9}a:hover{color:#033a96}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; align-items: center; justify-content: center; position: relative; height: 44px">
<span style="font-size: 17px; font-weight: 600">Settings</span>
</div>
<section style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Your Pingu</h2>
<img src="../../../../Circleu/Assets.xcassets/GuestPinguJournal.imageset/GuestPinguJournal.png" alt="" style="height: 90px; object-fit: contain">
<p style="margin: 0; font-size: 14px; color: #4F6077">Tap to change.</p>
</section>
<section style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Privacy and data</h2>
<p style="margin: 0; font-size: 14px; color: #4F6077">Kept on this iPhone. Not uploaded or synced.</p>
<a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">Learn more ›</a>
</section>
<section style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Your data</h2>
<p style="margin: 0; font-size: 14px; color: #4F6077">A text file you can save or share.</p>
<button style="height: 48px; border-radius: 16px; border: 1px solid #DCE6F2; background: #FFFFFF; color: #054FC9; font-family: inherit; font-size: 16px; font-weight: 600">Export my data</button>
<button style="height: 44px; border: none; background: transparent; color: #B02020; font-family: inherit; font-size: 15px; font-weight: 600">Delete all data</button>
</section>
<section style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Earlier CircleU account</h2>
<p style="margin: 0; font-size: 14px; color: #4F6077">Bring in your journal from an earlier account.</p>
<button style="height: 48px; border-radius: 16px; border: 1px solid #DCE6F2; background: #FFFFFF; color: #054FC9; font-family: inherit; font-size: 16px; font-weight: 600">Log in to bring in your journal</button>
</section>
</div>
</body>
</html>
