<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B1 Prompt chips, empty</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; justify-content: space-between"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span></div>
<h1 style="margin: 8px 0 0 0; font-size: 30px; font-weight: 700">What’s on your mind?</h1>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 80px; height: 80px; border-radius: 40px; background: #054FC9"></span>
<span style="font-size: 13px; color: #4F6077">Tap to talk</span>
</div>
<p style="margin: 6px 0 0 0; font-size: 13px; font-weight: 600; color: #4F6077">Not sure where to start?</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="border: 1px solid #BBD6F7; background: #FFFFFF; color: #054FC9; border-radius: 18px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600">What happened?</button>
<button style="border: 1px solid #BBD6F7; background: #FFFFFF; color: #054FC9; border-radius: 18px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600">Who was it with?</button>
<button style="border: 1px solid #BBD6F7; background: #FFFFFF; color: #054FC9; border-radius: 18px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600">What do you wish you’d said?</button>
</div>
<div style="flex-grow: 1; border-radius: 18px; background: #FFFFFF; padding: 16px; font-size: 17px; color: #8A99AD">Tap a question to start with it, or just write.</div>
<div style="height: 54px; border-radius: 18px; background: #8DB0E8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Save</div>
</div>
</body>
</html>
