<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simpler Journal calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#054FC9}a:hover{color:#033a96}
.d{height: 40px; border: none; background: transparent; border-radius: 10px; font-family: inherit; font-size: 15px; color: #0D1421; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0}
.dots{display: flex; gap: 2px; height: 4px}
.dot{width: 4px; height: 4px; border-radius: 2px; background: #054FC9}
.wd{font-size: 12px; font-weight: 600; color: #4F6077; text-align: center}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 20px 24px 20px; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 34px; font-weight: 700">Journal</h1>
<button aria-label="Hide calendar" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #054FC9; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button>
</div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 10px 12px 12px 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center">
<button aria-label="Previous month" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<strong style="flex-grow: 1; text-align: center; font-size: 17px">October 2026</strong>
<button aria-label="Go to today" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5" fill="#054FC9"></circle></svg></button>
<button aria-label="Next month" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px">
<span class="wd">S</span><span class="wd">M</span><span class="wd">T</span><span class="wd">W</span><span class="wd">T</span><span class="wd">F</span><span class="wd">S</span>
<span></span><span></span><span></span><span></span>
<button class="d">1<span class="dots"></span></button><button class="d">2<span class="dots"></span></button><button class="d">3<span class="dots"></span></button>
<button class="d">4<span class="dots"></span></button><button class="d">5<span class="dots"><span class="dot"></span></span></button><button class="d">6<span class="dots"></span></button><button class="d">7<span class="dots"></span></button><button class="d">8<span class="dots"><span class="dot"></span></span></button><button class="d">9<span class="dots"></span></button><button class="d">10<span class="dots"></span></button>
<button class="d">11<span class="dots"></span></button><button class="d">12<span class="dots"><span class="dot"></span><span class="dot"></span></span></button><button class="d">13<span class="dots"></span></button><button class="d">14<span class="dots"></span></button><button class="d">15<span class="dots"></span></button><button class="d">16<span class="dots"><span class="dot"></span></span></button><button class="d">17<span class="dots"></span></button>
<button class="d">18<span class="dots"></span></button><button class="d">19<span class="dots"></span></button><button class="d">20<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></button><button class="d">21<span class="dots"></span></button><button class="d">22<span class="dots"></span></button><button class="d">23<span class="dots"></span></button><button class="d">24<span class="dots"><span class="dot"></span></span></button>
<button class="d">25<span class="dots"><span class="dot"></span></span></button>
<button class="d" aria-label="26 October, 2 entries" style="background: #054FC9; color: #FFFFFF; font-weight: 700">26<span class="dots"><span class="dot" style="background: #FFFFFF"></span><span class="dot" style="background: #FFFFFF"></span></span></button>
<button class="d">27<span class="dots"></span></button><button class="d">28<span class="dots"></span></button><button class="d">29<span class="dots"></span></button><button class="d">30<span class="dots"></span></button><button class="d">31<span class="dots"></span></button>
</div>
</div>
<div style="display: flex">
<button aria-label="Show all" style="height: 36px; border-radius: 18px; border: none; background: #EAF2FF; color: #054FC9; font-family: inherit; font-size: 15px; font-weight: 600; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 6px">26 Oct<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="JS3-Entry.html" style="display: flex; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 12px; text-decoration: none; color: #0D1421">
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<span style="font-size: 16px; line-height: 1.35">My groupmate missed the deadline again and I froze in the meeting.</span>
<div style="display: flex; align-items: center; gap: 10px">
<img src="../../../../Circleu/Assets.xcassets/GuestIconReflection.imageset/GuestIconReflection@3x.png" alt="Has a reflection" style="width: 18px; height: 18px">
<img src="../../../../Circleu/Assets.xcassets/GuestIconNextStep.imageset/GuestIconNextStep@3x.png" alt="Next step not done" style="width: 18px; height: 18px">
<img src="../../../../Circleu/Assets.xcassets/GuestIconPractice.imageset/GuestIconPractice@3x.png" alt="Has a practice message" style="width: 18px; height: 18px">
<span style="flex-grow: 1"></span><span style="font-size: 12px; color: #4F6077">09:40</span>
</div>
</div>
</a>
<a href="JS3-Entry.html" style="display: flex; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 12px; text-decoration: none; color: #0D1421">
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<span style="font-size: 16px; line-height: 1.35">Lunch with Sam went better than I expected.</span>
<div style="display: flex; align-items: center; gap: 10px"><span style="flex-grow: 1"></span><span style="font-size: 12px; color: #4F6077">13:15</span></div>
</div>
</a>
</div>
<div style="flex-grow: 1"></div>
<nav style="display: flex; justify-content: space-around; padding: 10px 0 0 0; font-size: 12px; font-weight: 600"><a href="Main.html" style="color: #0D1421; text-decoration: none">Today</a><a href="JS1-List.html" style="color: #054FC9; text-decoration: none">Journal</a><a href="Practice.html" style="color: #0D1421; text-decoration: none">Practice</a></nav>
</div>
</body>
</html>
