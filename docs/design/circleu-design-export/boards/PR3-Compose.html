<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice compose</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#054FC9}a:hover{color:#033a96}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; align-items: center; height: 44px"><a href="PR1-Home.html" style="font-size: 17px; text-decoration: none">Back</a></div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.15">What would you like to say?</h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border-radius: 16px; padding: 6px 10px; font-size: 13px; font-weight: 600; color: #054FC9"><img src="../../../../Circleu/Assets.xcassets/GuestIconJournal.imageset/GuestIconJournal@3x.png" alt="" style="width: 16px; height: 16px">From: My groupmate missed…</span>
</div>
<div style="display: flex; gap: 8px">
<button style="border: 1px solid #BBD6F7; background: #FFFFFF; color: #054FC9; border-radius: 18px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Situation</button>
<button style="border: 1px solid #BBD6F7; background: #FFFFFF; color: #054FC9; border-radius: 18px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Goal</button>
</div>
<label style="position: relative; display: flex; flex-direction: column; flex-grow: 1; max-height: 300px">
<span style="position: absolute; left: -9999px">Your wording</span>
<textarea style="flex-grow: 1; border: none; border-radius: 24px 24px 6px 24px; background: #FFFFFF; padding: 18px 18px 52px 18px; font-family: inherit; font-size: 17px; line-height: 1.45; color: #0D1421; resize: none">Hey, can we talk about Friday? I felt stuck with most of the slides</textarea>
<button aria-label="Copy" style="position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 22px; border: none; background: #E6F0FF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg></button>
</label>
<button style="align-self: flex-start; border: none; background: transparent; padding: 0; font-family: inherit; display: flex; align-items: center; gap: 10px">
<img src="../../../../Circleu/Assets.xcassets/GuestPinguThoughtful.imageset/GuestPinguThoughtful.png" alt="" style="width: 56px; height: 56px; object-fit: contain">
<span style="background: #E6F0FF; color: #054FC9; border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-size: 15px; font-weight: 600">Get a suggestion</span>
</button>
<div style="flex-grow: 1"></div>
<button style="height: 54px; border-radius: 18px; border: none; background: #054FC9; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">Save</button>
</div>
</body>
</html>
