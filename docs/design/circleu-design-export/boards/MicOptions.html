<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Microphone icon options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 880px; height: 420px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; padding: 40px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Microphone: three directions</h1>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="A: soft illustrated microphone">
<circle cx="60" cy="60" r="56" fill="#DCEBFF"></circle>
<ellipse cx="60" cy="98" rx="26" ry="5" fill="#BBD6F7"></ellipse>
<rect x="45" y="22" width="30" height="50" rx="15" fill="#054FC9"></rect>
<rect x="49" y="26" width="9" height="40" rx="4.5" fill="#3D7FE8"></rect>
<path d="M36 58a24 24 0 0 0 48 0" fill="none" stroke="#0D1421" stroke-width="5" stroke-linecap="round"></path>
<path d="M60 82v12" stroke="#0D1421" stroke-width="5" stroke-linecap="round"></path>
<path d="M48 94h24" stroke="#F28C28" stroke-width="5" stroke-linecap="round"></path>
</svg>
<strong style="font-size: 16px">A · Illustrated mic</strong>
<span style="font-size: 13px; color: #4F6077; text-align: center">Same soft shading as the tab icons, orange base like Pingu’s feet.</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="B: Pingu holding a microphone">
<circle cx="60" cy="60" r="56" fill="#DCEBFF"></circle>
<ellipse cx="60" cy="74" rx="28" ry="32" fill="#14254A"></ellipse>
<ellipse cx="60" cy="80" rx="18" ry="22" fill="#FFFFFF"></ellipse>
<circle cx="60" cy="44" r="20" fill="#14254A"></circle>
<ellipse cx="60" cy="48" rx="13" ry="11" fill="#FFFFFF"></ellipse>
<circle cx="54" cy="45" r="2.5" fill="#0D1421"></circle>
<circle cx="66" cy="45" r="2.5" fill="#0D1421"></circle>
<path d="M56 51l4 4 4-4z" fill="#F28C28"></path>
<rect x="74" y="58" width="12" height="20" rx="6" fill="#054FC9"></rect>
<path d="M80 78v8" stroke="#0D1421" stroke-width="3"></path>
<ellipse cx="50" cy="104" rx="7" ry="3" fill="#F28C28"></ellipse>
<ellipse cx="70" cy="104" rx="7" ry="3" fill="#F28C28"></ellipse>
</svg>
<strong style="font-size: 16px">B · Pingu with a mic</strong>
<span style="font-size: 13px; color: #4F6077; text-align: center">Warmest. Pingu “listens”. Needs proper artwork from the Pingu artist style.</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="C: brand blue button with ice ring">
<circle cx="60" cy="60" r="56" fill="#FFFFFF" stroke="#BBD6F7" stroke-width="6"></circle>
<circle cx="60" cy="60" r="42" fill="#054FC9"></circle>
<rect x="52" y="38" width="16" height="28" rx="8" fill="#FFFFFF"></rect>
<path d="M44 58a16 16 0 0 0 32 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path>
<path d="M60 74v8" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path>
</svg>
<strong style="font-size: 16px">C · Clean, with an ice ring</strong>
<span style="font-size: 13px; color: #4F6077; text-align: center">Closest to now; the ring pulses while listening.</span>
</div>
</div>
</div>
</body>
</html>
