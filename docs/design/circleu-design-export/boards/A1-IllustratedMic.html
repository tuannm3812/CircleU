<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A1 Illustrated mic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; justify-content: space-between"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span></div>
<h1 style="margin: 8px 0 0 0; font-size: 30px; font-weight: 700">What’s on your mind?</h1>
<p style="margin: 0; font-size: 15px; color: #4F6077">Type, or tap the microphone and talk.</p>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<button aria-label="Start dictation" style="border: none; background: transparent; padding: 0">
<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
<circle cx="60" cy="60" r="56" fill="#DCEBFF"></circle>
<ellipse cx="60" cy="100" rx="26" ry="5" fill="#BBD6F7"></ellipse>
<rect x="45" y="22" width="30" height="50" rx="15" fill="#054FC9"></rect>
<rect x="49" y="26" width="9" height="40" rx="4.5" fill="#3D7FE8"></rect>
<path d="M36 58a24 24 0 0 0 48 0" fill="none" stroke="#0D1421" stroke-width="5" stroke-linecap="round"></path>
<path d="M60 82v12" stroke="#0D1421" stroke-width="5" stroke-linecap="round"></path>
<path d="M48 94h24" stroke="#F28C28" stroke-width="5" stroke-linecap="round"></path>
</svg>
</button>
<span style="font-size: 13px; color: #4F6077">Tap to talk</span>
<span style="font-size: 11px; font-weight: 700; color: #B05A00; background: #FFF1E0; border-radius: 8px; padding: 3px 8px">PLACEHOLDER ART · needs brand-style mic</span>
</div>
<div style="flex-grow: 1; border-radius: 18px; background: #FFFFFF"></div>
<div style="height: 54px; border-radius: 18px; background: #054FC9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Save only my words</div>
</div>
</body>
</html>
