<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C2 Evening backdrop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(#1B2F66 0%, #6C7FC4 30%, #F5FAFF 55%); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px; position: relative; overflow: hidden">
<span style="position: absolute; right: -40px; top: 40px; width: 180px; height: 180px; border-radius: 90px; background: #F4F1FF; opacity: 0.55"></span>
<svg style="position: absolute; left: 0; top: 250px" width="390" height="80" viewBox="0 0 390 80" aria-hidden="true"><path d="M0 50 Q60 20 120 44 T240 40 T390 36 V80 H0 Z" fill="#DCEBFF"></path></svg>
<h1 style="position: relative; margin: 60px 0 0 0; font-size: 30px; font-weight: 700">Good evening</h1>
<p style="position: relative; margin: 0; font-size: 15px; color: #4F6077">How did today go?</p>
<div style="position: relative; height: 90px"></div>
<div style="position: relative; display: flex; align-items: center; gap: 12px"><span style="width: 56px; height: 56px; border-radius: 28px; background: #054FC9"></span><span style="font-size: 13px; color: #4F6077">Tap to talk</span></div>
<div style="position: relative; flex-grow: 1; border-radius: 18px; background: #FFFFFF; padding: 16px; font-size: 17px; color: #8A99AD">Write it down, or tap to talk.</div>
<div style="position: relative; height: 54px; border-radius: 18px; background: #054FC9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Save</div>
<span style="position: absolute; left: 24px; bottom: 90px; font-size: 11px; font-weight: 700; color: #B05A00; background: #FFF1E0; border-radius: 8px; padding: 3px 8px">PLACEHOLDER · evening gradient + moon</span>
</div>
</body>
</html>
