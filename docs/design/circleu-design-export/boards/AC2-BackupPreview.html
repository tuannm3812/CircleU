<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backup preview (proposed)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#054FC9}a:hover{color:#033a96}
.chip{display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: #E3EEFF; font-size: 13px; font-weight: 600; color: #054FC9}
.primary{height: 54px; border-radius: 18px; border: none; background: #054FC9; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600}
.secondary{height: 54px; border-radius: 18px; border: 1px solid #DCE6F2; background: #FFFFFF; color: #054FC9; font-family: inherit; font-size: 17px; font-weight: 600}
.ib{width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px"><a href="S-LogIn-New.html" style="font-size: 16px; font-weight: 600; text-decoration: none">‹ Log in</a><span style="font-size: 17px; font-weight: 600"></span><button class="ib" aria-label="What isn’t copied"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></button></div>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Your account’s backup</h1>
<div style="display: flex; gap: 8px">
<span class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 10l5 5 5-5M5 21h14"></path></svg>5 to copy</span>
<span class="chip" style="background: #EEF1F5; color: #4F6077"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4F6077" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>2 already here</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px">I told my friend I needed space this weekend.</span><span style="font-size: 12px; color: #4F6077">3 Mar 2026</span></div>
<div style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px">Work review went fine, but I didn’t ask about…</span><span style="font-size: 12px; color: #4F6077">28 Feb 2026</span></div>
<div style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px">Mum called again about the move.</span><span style="font-size: 12px; color: #4F6077">20 Feb 2026</span></div>
</div>
<button style="align-self: flex-start; display: flex; align-items: center; gap: 6px; min-height: 44px; border: none; background: transparent; padding: 0; font-family: inherit; font-size: 15px; font-weight: 600; color: #054FC9"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>Left out (1)</button>
<div style="flex-grow: 1"></div>
<button class="primary">Copy into this journal</button>
<button class="secondary">Don’t copy</button>
</div>
</body>
</html>
