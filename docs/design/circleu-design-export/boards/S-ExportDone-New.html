<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export done and delete all (proposed)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 20px 24px 20px; gap: 18px">
<div role="status" style="display: flex; gap: 12px; align-items: center; background: #E6F4EC; border-radius: 18px; padding: 10px 14px">
<img src="../../../../Circleu/Assets.xcassets/GuestPinguBackpack.imageset/GuestPinguBackpack.png" alt="" style="width: 52px; height: 52px; object-fit: contain">
<span style="font-size: 15px; font-weight: 600; color: #134A2B">Export done</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="padding-left: 16px; font-size: 13px; font-weight: 600; color: #4F6077">Your data</span>
<div style="background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; font-size: 16px">
<img src="../../../../Circleu/Assets.xcassets/GuestIconNextStep.imageset/GuestIconNextStep@3x.png" alt="" style="width: 28px; height: 28px">Export my data</div>
<div style="height: 1px; background: #E8EEF6; margin-left: 56px"></div>
<div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; font-size: 16px; color: #B02020">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #FCE8E8"></span>Delete all data</div>
</div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(13,20,33,0.32); display: flex; align-items: center; justify-content: center">
<div role="alertdialog" aria-label="Delete all data?" style="width: 290px; background: #FFFFFF; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center">
<img src="../../../../Circleu/Assets.xcassets/GuestPinguThoughtful.imageset/GuestPinguThoughtful.png" alt="" style="height: 84px; object-fit: contain; margin-top: 18px">
<strong style="font-size: 17px; margin-top: 8px">Delete all data?</strong>
<span style="font-size: 14px; color: #4F6077; padding: 4px 18px 16px 18px">Everything here, including drafts.</span>
<div style="width: 100%; height: 1px; background: #E8EEF6"></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; width: 100%">
<button style="height: 48px; border: none; border-right: 1px solid #E8EEF6; background: transparent; color: #054FC9; font-family: inherit; font-size: 16px; font-weight: 600">Cancel</button>
<button style="height: 48px; border: none; background: transparent; color: #B02020; font-family: inherit; font-size: 16px; font-weight: 700">Delete all</button>
</div>
</div>
</div>
</div>
</body>
</html>
