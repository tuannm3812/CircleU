<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D3 Visual Today, writing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#054FC9}a:hover{color:#033a96}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 0 24px; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<button aria-label="Your Pingu" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE6F2; background: #FFFFFF; padding: 4px; display: flex; align-items: center; justify-content: center"><img src="../../../../Circleu/Assets.xcassets/GuestPinguJournal.imageset/GuestPinguJournal.png" alt="" style="width: 34px; height: 34px; object-fit: contain"></button>
<button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE6F2; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D1421" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.15">What’s on your mind?</h1>
<button aria-label="Start dictation" style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 26px; border: none; background: #054FC9; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="#FFFFFF"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>
</div>
<div style="display: flex; align-items: flex-end; gap: 8px">
<img src="../../../../Circleu/Assets.xcassets/GuestPinguThoughtful.imageset/GuestPinguThoughtful.png" alt="" style="flex-shrink: 0; width: 64px; height: 64px; object-fit: contain">
<div style="flex-grow: 1; background: #054FC9; color: #FFFFFF; border-radius: 18px 18px 18px 4px; padding: 12px 12px 6px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; line-height: 1.35">What did you want them to understand?</span>
<div style="display: flex; align-items: center; gap: 4px">
<button style="display: flex; align-items: center; gap: 6px; min-height: 36px; border: none; border-radius: 18px; background: #FFFFFF; color: #054FC9; padding: 0 14px 0 10px; font-family: inherit; font-size: 14px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#054FC9" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
<button aria-label="Another question" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg></button>
<span style="flex-grow: 1"></span>
<button aria-label="Hide" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>
</div>
<div style="flex-grow: 1; border-radius: 18px; background: #FFFFFF; padding: 16px; font-size: 17px; line-height: 1.4">My manager moved my project to someone else without asking me first, and I didn’t say anything<span style="display: inline-block; width: 2px; height: 20px; background: #054FC9; vertical-align: middle; margin-left: 2px"></span></div>
<button style="height: 54px; border-radius: 18px; border: none; background: #054FC9; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">Save</button>
<div aria-hidden="true" style="height: 250px; margin: 0 -24px; background: #D3D8DF; display: flex; align-items: center; justify-content: center; color: #6B7686; font-size: 13px; font-weight: 600">keyboard</div>
</div>
</body>
</html>
