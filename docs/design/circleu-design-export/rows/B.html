<body><section class="row" id="row-B"><h2>B · Get a suggestion redesign</h2><div class="boards"><figure class="board" data-board="B1-PromptChips.html"><figcaption>T6 (proposed) · B1 Prompt chips (empty)</figcaption><div class="frame" style="width:390px;height:844px;border-radius:36px">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">

<button style="border: 1px solid #BBD6F7; background: #FFFFFF; color: #054FC9; border-radius: 18px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600">What happened?</button>
<button style="border: 1px solid #BBD6F7; background: #FFFFFF; color: #054FC9; border-radius: 18px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600">Who was it with?</button>
<button style="border: 1px solid #BBD6F7; background: #FFFFFF; color: #054FC9; border-radius: 18px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600">What do you wish you’d said?</button>
</div>
<div style="flex-grow: 1; border-radius: 18px; background: #FFFFFF; padding: 16px; font-size: 17px; color: #8A99AD">Tap a question to start with it, or just write.</div>
<div style="height: 54px; border-radius: 18px; background: #8DB0E8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Save</div>
</div>
</div></figure><figure class="board" data-board="B2-Nudge.html"><figcaption>T6 (proposed) · B2 Need a nudge? (writing)</figcaption><div class="frame" style="width:390px;height:844px;border-radius:36px">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 14px">
<div style="display: flex; justify-content: space-between"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE6F2"></span></div>
<h1 style="margin: 8px 0 0 0; font-size: 30px; font-weight: 700">What’s on your mind?</h1>

<span style="font-size: 13px; color: #4F6077">Tap to talk</span>
</div>

<span style="font-size: 12px; font-weight: 700; opacity: 0.85">NEED A NUDGE?</span>
<span style="font-size: 15px">What did you want them to understand?</span>
<div style="display: flex; gap: 14px; font-size: 13px; font-weight: 700"><span>Add to my words</span><span style="opacity: 0.8">Another question</span><span style="opacity: 0.8">Hide</span></div>
</div>
<div style="flex-grow: 1; border-radius: 18px; background: #FFFFFF; padding: 16px; font-size: 17px; line-height: 1.45">My groupmate missed the deadline again. I froze in the meeting and didn’t say anything, and now I’m annoyed at myself.</div>
<div style="height: 54px; border-radius: 18px; background: #054FC9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px">Save</div>
</div>
</div></figure><figure class="board" data-board="B3-AfterSave.html"><figcaption>T6 (proposed) · B3 After save: optional reflection</figcaption><div class="frame" style="width:390px;height:844px;border-radius:36px">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5FAFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0D1421; display: flex; flex-direction: column; padding: 56px 24px 24px 24px; gap: 16px">
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Journal</h1>

</div>
<div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px">My groupmate missed the deadline again. I froze in the meeting…</span><span style="font-size: 12px; color: #4F6077">26 Oct at 10:58</span></div>
<p style="margin: 0; font-size: 13px; color: #4F6077">Saving never needs a reflection. “Reflect on it” opens the same review as today’s Get a suggestion, but for a saved entry.</p>
