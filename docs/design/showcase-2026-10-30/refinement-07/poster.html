<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CircleU poster v7</title>
<style>
  @font-face { font-family: "Plus Jakarta Sans"; src: url("assets/PlusJakartaSans.ttf") format("truetype"); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", -apple-system, sans-serif; color: #0d1421;
    background: #f5faff url("assets/background.png") center / cover no-repeat;
    position: relative;
  }
  /* soft "ice" bands */
  .band { position: absolute; left: 520px; right: -80px; height: 150px; border-radius: 120px;
          background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(214,231,255,.55)); filter: blur(1px); }
  .band.a { top: 520px; transform: rotate(-4deg); }
  .band.b { top: 610px; transform: rotate(-2deg); left: 450px; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(198,220,255,.6)); }

  /* Hides the text baked into the cover artwork; the scene and Pingu on the right stay untouched. */
  /* The journal Pingu (the same figure as in the v6 artwork, as its transparent original), sitting on
     the ice shelf at the right with a soft ground shadow so he belongs to the scene. */
  .hero { position: absolute; right: 26px; bottom: 14px; width: 292px; z-index: 5; filter: drop-shadow(0 10px 14px rgba(13,20,33,.22)); }
  .hero-shadow { position: absolute; right: 36px; bottom: 16px; width: 270px; height: 44px; border-radius: 50%; z-index: 4;
                 background: radial-gradient(ellipse at center, rgba(13,20,33,.28) 0%, rgba(13,20,33,0) 70%); }
  .left { position: absolute; left: 64px; top: 56px; width: 400px; }
  .wordmark { display: flex; align-items: center; gap: 12px; }
  .wordmark img { width: 64px; height: 64px; }
  .wordmark span { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; }
  h1 { margin-top: 44px; font-size: 44px; line-height: 1.08; font-weight: 800; letter-spacing: -0.8px; }
  .intro { margin-top: 18px; font-size: 18.5px; line-height: 1.4; color: #465d7f; }
  .label { margin-top: 30px; font-size: 15px; font-weight: 700; color: #054fc9; }
  .steps { margin-top: 26px; list-style: none; counter-reset: step; }
  .steps li { counter-increment: step; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; line-height: 1.2; margin-bottom: 10px; }
  .steps li::before { content: counter(step); width: 36px; height: 36px; border-radius: 50%; background: #054fc9; color: #fff;
                      font-size: 17px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .trust { margin-top: 18px; font-size: 16px; font-weight: 600; color: #054fc9; }
  .foot { position: absolute; left: 66px; bottom: 22px; display: flex; align-items: flex-end; gap: 22px; }
  /* The official lockup is black on white; multiply lets the ice show through its white box. */
  .foot img.lockup { height: 120px; mix-blend-mode: multiply; }
  .foot img.pingu { height: 120px; margin-bottom: -6px; filter: drop-shadow(0 10px 16px rgba(13,20,33,.2)); }

  .phones { position: absolute; left: 472px; top: 44px; width: 600px; height: 676px; }
  .phone { position: absolute; border-radius: 38px; background: #0d1421; padding: 6px;
           box-shadow: 0 30px 60px rgba(13,20,33,.28), 0 6px 14px rgba(13,20,33,.18); }
  .phone img { display: block; border-radius: 32px; width: 100%; }
  .phone.side { width: 200px; top: 120px; }
  .phone.left  { left: 0px;  transform: rotate(-5deg); }
  .phone.right { left: 400px; transform: rotate(5deg); }
  .phone.main  { width: 236px; left: 182px; top: 62px; z-index: 2; }
  .phone .cap { position: absolute; left: 50%; transform: translateX(-50%); top: -36px; white-space: nowrap;
                font-size: 15px; font-weight: 700; color: #054fc9; background: #fff; padding: 6px 14px; border-radius: 999px;
                box-shadow: 0 4px 12px rgba(13,20,33,.1); }
</style>
</head>
<body>

  <div class="left">
    <div class="wordmark"><img src="assets/logo.png" alt=""><span>CircleU</span></div>
    <h1>Some<br>conversations<br>stay with you</h1>
    <p class="intro">A private place to reflect on what happened and find your own words for what comes next.</p>
    <ol class="steps">
      <li>Write it down.</li>
      <li>Tag how it felt.</li>
      <li>Find your words.</li>
    </ol>
    <p class="trust">Private by design. Kept on your iPhone.</p>
  </div>

  <div class="phones">
    <div class="phone side left"><img src="assets/journal.png" alt="Journal screen"></div>
    <div class="phone main"><img src="assets/today.png" alt="Today screen"></div>
    <div class="phone side right"><img src="assets/practice.png" alt="Practice screen"></div>
  </div>

  <div class="hero-shadow"></div>
  <img class="hero" src="assets/pingu-considering.png" alt="">

  <div class="foot">
    <img class="lockup" src="assets/program-lockup.png" alt="UTS Apple Foundation Program">
    <img class="pingu" src="assets/pingu-calm.png" alt="">
  </div>
</body>
</html>
