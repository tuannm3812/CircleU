<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CircleU pocket card</title>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("../../refinement-07/assets/PlusJakartaSans.ttf");font-weight:200 800}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1200px;height:627px;overflow:hidden}
body{font-family:"Plus Jakarta Sans",sans-serif;color:#0d1421;background:#f5faff url("../../refinement-07/assets/background.png") center/cover no-repeat;position:relative}
.head{position:absolute;left:48px;top:30px;display:flex;align-items:center;gap:12px}.head img{width:46px;height:46px}.head b{font-size:28px;font-weight:800;letter-spacing:-.5px}
.left{position:absolute;left:48px;top:118px;width:372px}
h1{font-size:40px;line-height:1.08;font-weight:800;letter-spacing:-.8px}
p{margin-top:16px;font-size:18px;line-height:1.4;color:#465d7f}
ul{margin-top:22px;list-style:none}li{font-size:18px;font-weight:700;margin-bottom:11px;display:flex;gap:11px;align-items:center}
li::before{content:"";width:10px;height:10px;border-radius:50%;background:#054fc9;flex:none}
.trust{margin-top:18px;font-size:15px;font-weight:600;color:#054fc9}
.card{position:absolute;left:440px;top:82px;width:336px;border-radius:26px;box-shadow:0 26px 52px rgba(13,20,33,.3);transform:rotate(-3deg)}
.widget{position:absolute;left:800px;top:252px;width:352px;border-radius:32px;box-shadow:0 22px 44px rgba(13,20,33,.32);transform:rotate(2deg)}
.lab{position:absolute;font-size:14.5px;font-weight:700;color:#054fc9;background:#fff;padding:7px 14px;border-radius:999px}
</style></head><body><div class="head"><img src="../../refinement-07/assets/logo.png" alt=""><b>CircleU</b></div>
<div class="left"><h1>Your words, ready before you talk</h1><p>Practise a hard message, then keep it close for the real conversation.</p>
<ul><li>A card made from your own words</li><li>On your Home Screen as a widget</li><li>Tap to open the whole card</li></ul><p class="trust">Made and kept on your iPhone.</p></div>
<img class="card" src="../assets/card.png" alt="Pocket card"><img class="widget" src="../assets/widget.png" alt="Home Screen widget">
<span class="lab" style="left:886px;top:200px">Home Screen widget</span>
</body></html>
